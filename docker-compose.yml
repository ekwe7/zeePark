version: '3.8'

services:
  zeepark-mongodb:
    image: mongo:7.0
    container_name: zeepark-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASSWORD}
      - MONGO_INITDB_DATABASE=${DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - zeepark-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  zeepark-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ekwe7/zeepark-server:1.0
    container_name: zeepark-backend
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://${DB_USER}:${DB_PASSWORD}@zeepark-mongodb:27017/${DB_NAME}?authSource=admin
      - SPRING_DATA_MONGODB_URI=mongodb://${DB_USER}:${DB_PASSWORD}@zeepark-mongodb:27017/${DB_NAME}?authSource=admin
    depends_on:
      zeepark-mongodb:
        condition: service_healthy
    networks:
      - zeepark-net

volumes:
  mongo_data:
    driver: local

networks:
  zeepark-net:
    driver: bridge

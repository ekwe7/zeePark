version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: zeepark-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zeepark
    volumes:
      - mongo_data:/data/db
    networks:
      - zeepark-net

  zeepark-app:
    # UPDATED: Matches the username, repo, and tag you just pushed
    image: ekwe7/zeepark-server:1.0   
    container_name: zeepark-app
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      # Standard Spring Boot variable + your custom one
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/zeepark
      MONGODB_URI: mongodb://mongodb:27017/zeepark
      FLW_PUBLIC_KEY: ${FLW_PUBLIC_KEY}
      FLW_SECRET_KEY: ${FLW_SECRET_KEY}
      FLW_REDIRECT_URL: ${FLW_REDIRECT_URL:-zeepark://payment/success}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_SECRET: ${PAYPAL_SECRET}
    depends_on:
      - mongodb
    networks:
      - zeepark-net

volumes:
  mongo_data:
    driver: local

networks:
  zeepark-net:
    driver: bridge
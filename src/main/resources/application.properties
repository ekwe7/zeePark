spring.application.name=zeePark

# Force use of Environment Variables for Render
# If SPRING_DATA_MONGODB_URI is not found, it will fail (which is good for debugging)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Render uses $PORT, default to 8080 if not set
server.port=${PORT:8080}

# Standard Config
spring.data.mongodb.auto-index-creation=true
spring.threads.virtual.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.com.ekwe_hub=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Payment Config
payment.paypal.client-id=${PAYPAL_CLIENT_ID:}
payment.paypal.secret=${PAYPAL_SECRET:}
payment.paypal.mode=${PAYPAL_MODE:sandbox}
payment.mastercard.api-key=${MASTERCARD_API_KEY:}
payment.mastercard.merchant-id=${MASTERCARD_MERCHANT_ID:}
payment.flutterwave.public-key=${FLW_PUBLIC_KEY:}
payment.flutterwave.secret-key=${FLW_SECRET_KEY:}
payment.flutterwave.redirect-url=${FLW_REDIRECT_URL:zeepark://payment/success}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.application.name=zeePark
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/zeepark}
spring.data.mongodb.auto-index-creation=true
spring.threads.virtual.enabled=true
server.port=${PORT:8181}
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.com.ekwe_hub=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Payment Gateway Config
payment.stripe.api-key=${STRIPE_API_KEY:}
payment.stripe.endpoint=https://api.stripe.com/v1
payment.paypal.client-id=${PAYPAL_CLIENT_ID:}
payment.paypal.secret=${PAYPAL_SECRET:}
payment.paypal.mode=${PAYPAL_MODE:sandbox}
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Binance Pay
payment.binance.api-key=${BINANCE_API_KEY:}
payment.binance.secret-key=${BINANCE_SECRET_KEY:}

# Mastercard
payment.mastercard.api-key=${MASTERCARD_API_KEY:}
payment.mastercard.merchant-id=${MASTERCARD_MERCHANT_ID:}
